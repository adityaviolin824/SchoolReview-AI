[project]
name = "vision-ai-project"
version = "0.1.0"
description = "Privacy-aware VLM workflow for validating school inspection images and officer comments."
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    "google-genai",
    "ipython",
    "jinja2>=3.1.6",
    "langchain-core>=1.4.8",
    "langgraph",
    "langsmith>=0.9.1",
    "matplotlib",
    "numpy",
    "openai",
    "opencv-python",
    "pillow",
    "pydantic",
    "pypdf>=6.14.2",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.2",
    "reportlab>=5.0.0",
    "weasyprint>=69.0",
]

[tool.uv]
managed = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
